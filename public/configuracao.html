<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atualizar Horário - HoloTime</title>

  <!-- Fontes e estilos -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Poppins:wght@100..900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="./styles/header.css" />
  <link rel="stylesheet" href="./styles/banner.css" />
  <link rel="stylesheet" href="./styles/configuracao.css" />
</head>
<body>
  <header class="header">
    <nav class="nav" aria-label="navegação principal">
      <ul class="nav__list">
        <li class="nav__item">
      
          <video autoplay loop muted width="120" height="100">
            <source src="./videos/logo.mp4" type="video/mp4" />
          </video>
          </a>
        </li>
        <li class="nav__item"><a href="home.html" class="nav__link">Voltar</a></li>

        
      </ul>
    </nav>
  </header>

  <section class="faixa-azul">
    <main style="text-align: center; color: white; padding: 2rem;">
      <h1>Atualização de Horário do Relógio</h1>
      <p style="max-width: 600px; margin: auto; font-size: 1.1rem;">
        Use o campo abaixo para definir um novo horário que será enviado ao relógio (simulado).
      </p>

      <div style="margin-top: 2rem;">
        <label for="horario" style="display: block; margin-bottom: 0.5rem;">Novo Horário:</label>
        <input type="datetime-local" id="horario" style="padding: 0.5rem; font-size: 1rem;" />

        <button id="btnAtualizar" style="margin-top: 1rem; padding: 0.7rem 2rem; font-weight: bold; border: none; border-radius: 8px; background-color: white; color: #2c4766;">
          Atualizar Horário
        </button>
      </div>
    </main>
  </section>

  <footer class="rodape-azul">
    <p style="color: white; text-align: center; padding: 2rem;">© 2025 HoloTime</p>
  </footer>

  <script>
    document.getElementById('btnAtualizar').addEventListener('click', async () => {
      const horario = document.getElementById('horario').value;
      if (!horario) {
        alert('Por favor, selecione o horário.');
        return;
      }

      const res = await fetch('/programar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ horario, acao: 'ATUALIZAR_HORA' })
      });

      const json = await res.json();
      alert(json.message || 'Horário atualizado com sucesso!');
    });
  </script>
</body>
</html>
